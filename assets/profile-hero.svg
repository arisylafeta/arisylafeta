    <circle cx="24" cy="18" r="6" fill="#22c55e"/>
    <text x="42" y="23" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">online</text>

    <text x="0" y="100" fill="#18181b" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="900" letter-spacing="-3">Arianit Sylafeta</text>
    <text x="2" y="145" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">Founder · CTO @ ReBattery · AI-native product builder</text>
  </g>

  <g transform="translate(116 304)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="0" y="0" width="174" height="46" rx="13" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="18" y="29" fill="#18181b" font-size="14">arisylafeta.com</text>

    <rect x="204" y="0" width="174" height="46" rx="13" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="222" y="29" fill="#18181b" font-size="14">@arisylafeta</text>

    <rect x="408" y="0" width="198" height="46" rx="13" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="426" y="29" fill="#18181b" font-size="14">battery markets</text>
