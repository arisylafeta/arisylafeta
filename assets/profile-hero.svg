<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arianit Sylafeta GitHub profile hero</title>
  <desc id="desc">A clean grid-card GitHub profile hero inspired by arisylafeta.com.</desc>
  <defs>
    <pattern id="micro-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#e5e7eb" stroke-width="1" opacity="0.55"/>
      <circle cx="1" cy="1" r="1" fill="#d4d4d8" opacity="0.75"/>
    </pattern>
    <linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#ffffff"/>
  <rect x="80" y="28" width="1040" height="364" fill="url(#cardFade)" stroke="#e5e7eb"/>
  <rect x="80" y="82" width="1040" height="190" fill="url(#micro-grid)"/>

  <path d="M80 82H1120M80 272H1120M80 326H1120" stroke="#e5e7eb"/>
  <path d="M80 28V392M1120 28V392M392 272V392M632 272V392M872 272V392" stroke="#e5e7eb"/>

  <g transform="translate(116 54)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <text x="0" y="0" fill="#18181b" font-weight="700">github://arisylafeta</text>
    <text x="772" y="0" fill="#71717a">Portfolio</text>
    <text x="862" y="0" fill="#71717a">Projects</text>
    <text x="946" y="0" fill="#71717a">Contact</text>
  </g>

  <g transform="translate(116 120)">
    <rect x="0" y="0" width="116" height="34" rx="17" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="22" cy="17" r="6" fill="#22c55e"/>
    <text x="38" y="22" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">online</text>

    <text x="0" y="94" fill="#18181b" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="850" letter-spacing="-2.5">Hi there, I'm Arianit 👋</text>
    <text x="2" y="138" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">Founder · CTO @ ReBattery · AI-native product builder</text>
  </g>

  <g transform="translate(104 288)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect class="grid-card" x="0" y="0" width="264" height="76" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="20" y="31" fill="#18181b" font-size="16" font-weight="700">Portfolio card</text>
    <text x="20" y="54" fill="#71717a" font-size="13">arisylafeta.com</text>

    <rect class="grid-card" x="288" y="0" width="216" height="76" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="308" y="31" fill="#18181b" font-size="16" font-weight="700">GitHub card</text>
    <text x="308" y="54" fill="#71717a" font-size="13">@arisylafeta</text>

    <rect class="grid-card" x="528" y="0" width="216" height="76" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="548" y="31" fill="#18181b" font-size="16" font-weight="700">LinkedIn card</text>
    <text x="548" y="54" fill="#71717a" font-size="13">@arianitsylafeta</text>

    <rect class="grid-card" x="768" y="0" width="224" height="76" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="788" y="31" fill="#18181b" font-size="16" font-weight="700">Currently</text>
    <text x="788" y="54" fill="#71717a" font-size="13">battery markets + AI</text>
  </g>
</svg>
