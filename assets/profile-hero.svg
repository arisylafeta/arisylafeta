<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arianit Sylafeta minimal portfolio card</title>
  <desc id="desc">A minimal-grid GitHub profile hero inspired by arisylafeta.com.</desc>
  <defs>
    <pattern id="minimal-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#e5e7eb" stroke-width="1" opacity="0.55"/>
      <circle cx="1" cy="1" r="1" fill="#d4d4d8" opacity="0.65"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#e4e4e7" stroke-width="1" opacity="0.85"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="238" cy="238" r="76"/>
    </clipPath>
  </defs>

  <rect width="1200" height="520" fill="url(#fade)"/>
  <rect x="214" y="0" width="760" height="520" fill="white" stroke="#e5e7eb"/>
  <rect x="214" y="56" width="760" height="218" fill="url(#minimal-grid)"/>
  <rect x="214" y="274" width="760" height="96" fill="url(#hatch)"/>
  <rect x="0" y="370" width="1200" height="34" fill="url(#hatch)"/>
  <rect x="0" y="470" width="1200" height="34" fill="url(#hatch)"/>

  <path d="M214 56H974M214 274H974M214 370H974M214 404H974M214 470H974M214 504H974" stroke="#e5e7eb"/>
  <path d="M214 0V520M974 0V520M364 274V370M580 404V470M758 404V470" stroke="#e5e7eb"/>

  <g transform="translate(650 18)">
    <text x="0" y="20" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700">Portfolio</text>
    <text x="92" y="20" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">Blog</text>
    <text x="145" y="20" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">Products</text>
    <rect x="230" y="-8" width="82" height="34" rx="17" fill="#fafafa" stroke="#e5e7eb"/>
    <circle cx="252" cy="9" r="7" stroke="#71717a" stroke-width="2"/>
    <path d="M258 15L264 21" stroke="#71717a" stroke-width="2" stroke-linecap="round"/>
    <text x="274" y="14" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">⌘K</text>
  </g>

  <g>
    <circle cx="238" cy="238" r="82" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <image href="me.png" x="162" y="162" width="152" height="152" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>
    <rect x="214" y="178" width="50" height="36" fill="#2563eb"/>
    <text x="228" y="202" fill="white" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif" font-size="20">🇽🇰</text>
  </g>

  <g transform="translate(388 316)">
    <text x="0" y="0" fill="#18181b" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">Arianit Sylafeta</text>
    <circle cx="302" cy="-10" r="10" fill="#1d9bf0"/>
    <path d="M297 -10L301 -6L308 -15" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="30" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">Founder · Co-Founder and CTO @ ReBattery</text>
  </g>

  <g transform="translate(232 420)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
    <rect x="0" y="0" width="26" height="26" rx="7" fill="#fafafa" stroke="#d4d4d8"/>
    <text x="42" y="18" fill="#18181b">London, United Kingdom</text>
    <rect x="392" y="0" width="26" height="26" rx="7" fill="#fafafa" stroke="#d4d4d8"/>
    <text x="434" y="18" fill="#18181b">he/him</text>
    <rect x="574" y="0" width="26" height="26" rx="7" fill="#fafafa" stroke="#d4d4d8"/>
    <text x="616" y="18" fill="#18181b">arisylafeta.com</text>
    <text x="7" y="18" fill="#71717a">⌖</text>
    <text x="399" y="18" fill="#71717a">♂</text>
    <text x="581" y="18" fill="#71717a">◎</text>
  </g>

  <g transform="translate(232 488)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <text x="0" y="0" fill="#71717a">Build in public, test with real workflows, acquire and refine taste.</text>
    <text x="622" y="0" fill="#18181b" font-weight="700">Battery data · Agent commerce · AI systems</text>
  </g>
</svg>
