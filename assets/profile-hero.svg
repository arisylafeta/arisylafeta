<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arianit Sylafeta GitHub profile hero</title>
  <desc id="desc">A minimal GitHub profile hero with a simple-grid detail inspired by arisylafeta.com.</desc>
  <defs>
    <pattern id="simple-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#e5e7eb" stroke-width="1" opacity="0.45"/>
      <circle cx="1" cy="1" r="1" fill="#d4d4d8" opacity="0.7"/>
    </pattern>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#canvas)"/>
  <rect x="90" y="0" width="1020" height="420" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="90" y="56" width="1020" height="276" fill="url(#simple-grid)"/>

  <path d="M90 56H1110M90 242H1110M90 314H1110M90 346H1110M90 388H1110" stroke="#e5e7eb"/>
  <path d="M90 0V420M1110 0V420M314 242V346M690 314V388" stroke="#e5e7eb"/>

  <g transform="translate(126 22)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
    <text x="0" y="0" fill="#18181b" font-weight="700">github://arisylafeta</text>
    <text x="740" y="0" fill="#71717a">Portfolio</text>
    <text x="834" y="0" fill="#71717a">Products</text>
    <text x="934" y="0" fill="#71717a">Blog</text>
  </g>

  <g transform="translate(126 114)">
    <rect x="0" y="0" width="116" height="34" rx="17" fill="#fafafa" stroke="#e5e7eb"/>
    <circle cx="22" cy="17" r="6" fill="#22c55e"/>
    <text x="38" y="22" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">online</text>

    <text x="0" y="92" fill="#18181b" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="850" letter-spacing="-2">Hi there, I'm Arianit 👋</text>
    <text x="0" y="136" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">Founder · CTO @ ReBattery · AI-native product builder</text>
  </g>

  <g transform="translate(126 274)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
    <rect x="0" y="0" width="178" height="40" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="18" y="25" fill="#18181b">battery markets</text>
    <rect x="194" y="0" width="170" height="40" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="212" y="25" fill="#18181b">agent commerce</text>
    <rect x="380" y="0" width="142" height="40" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="398" y="25" fill="#18181b">AI systems</text>
  </g>

  <g transform="translate(736 274)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <text x="0" y="0" fill="#71717a">Build in public, test with real workflows,</text>
    <text x="0" y="24" fill="#71717a">acquire and refine taste.</text>
  </g>
</svg>
