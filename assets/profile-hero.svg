<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arianit Sylafeta halftone GitHub hero</title>
  <desc id="desc">A monochrome halftone-dot profile hero for Arianit Sylafeta, Founder and CTO at ReBattery.</desc>
  <defs>
    <pattern id="halftone-dot" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#18181b" opacity="0.18"/>
    </pattern>
    <pattern id="halftone-dot-large" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.2" fill="#18181b" opacity="0.22"/>
    </pattern>
    <pattern id="fine-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#e4e4e7" stroke-width="1" opacity="0.72"/>
    </pattern>
    <radialGradient id="fadeDots" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(840 180) rotate(138) scale(390 250)">
      <stop stop-color="#18181b" stop-opacity="0.16"/>
      <stop offset="0.58" stop-color="#18181b" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#18181b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rightBlob">
      <path d="M684 40H1120V380H720C784 326 792 268 736 217C676 162 640 91 684 40Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" fill="#ffffff"/>
  <rect x="56" y="28" width="1088" height="364" rx="28" fill="#fafafa" stroke="#e4e4e7"/>
  <rect x="80" y="52" width="1040" height="316" rx="20" fill="#ffffff" stroke="#e4e4e7"/>
  <rect x="80" y="52" width="1040" height="316" rx="20" fill="url(#fine-grid)" opacity="0.7"/>
  <rect x="80" y="52" width="1040" height="316" rx="20" fill="url(#fadeDots)"/>

  <g clip-path="url(#rightBlob)">
    <rect x="620" y="20" width="560" height="390" fill="url(#halftone-dot)"/>
    <rect x="780" y="62" width="340" height="270" fill="url(#halftone-dot-large)" opacity="0.8"/>
  </g>

  <path d="M80 104H1120M80 284H1120M80 330H1120" stroke="#e4e4e7"/>
  <path d="M320 284V368M620 284V368M880 104V368" stroke="#e4e4e7"/>

  <g transform="translate(116 82)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
